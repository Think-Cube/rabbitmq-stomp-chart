{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rabbitmq.secretName" . }}
  labels:
    {{- include "rabbitmq.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ required "auth.username is required when auth.existingSecret is empty" .Values.auth.username | quote }}
  password: {{ required "auth.password is required when auth.existingSecret is empty" .Values.auth.password | quote }}
{{- end }}
