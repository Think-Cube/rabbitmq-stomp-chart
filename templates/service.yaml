apiVersion: v1
kind: Service
metadata:
  name: {{ include "rabbitmq.fullname" . }}
  labels:
    {{- include "rabbitmq.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: amqp
      port: {{ .Values.service.ports.amqp }}
      targetPort: amqp
      protocol: TCP
    - name: management
      port: {{ .Values.service.ports.management }}
      targetPort: management
      protocol: TCP
    - name: stomp
      port: {{ .Values.service.ports.stomp }}
      targetPort: stomp
      protocol: TCP
    - name: web-stomp
      port: {{ .Values.service.ports.webStomp }}
      targetPort: web-stomp
      protocol: TCP
    - name: metrics
      port: {{ .Values.service.ports.metrics }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "rabbitmq.selectorLabels" . | nindent 4 }}
---
# Governing service of the StatefulSet; gives the pod a stable DNS name.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rabbitmq.headlessName" . }}
  labels:
    {{- include "rabbitmq.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
      protocol: TCP
  selector:
    {{- include "rabbitmq.selectorLabels" . | nindent 4 }}
